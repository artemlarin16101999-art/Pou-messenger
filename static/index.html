

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pou</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#1e1e2e;color:#cdd6f4;height:100vh;overflow:hidden;display:flex}

/* Сайдбар */
.sidebar{width:250px;background:#181825;display:flex;flex-direction:column;border-right:1px solid #313244}
.brand{padding:14px;font-size:20px;font-weight:bold;color:#89b4fa;border-bottom:1px solid #313244}
.brand .me{font-size:11px;color:#6c7086;font-weight:normal;margin-top:3px}
.new-chat{margin:8px;padding:8px;background:#89b4fa;color:#1e1e2e;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer}
.chat-list{flex:1;overflow-y:auto}
.chat-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #252535;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-item:hover{background:#313244}
.chat-item.active{background:#313244;border-left:3px solid #89b4fa;padding-left:11px}
.chat-item .name{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .preview{font-size:11px;color:#6c7086;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .badge{background:#f38ba8;color:#1e1e2e;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.online-sec{padding:8px 14px;font-size:11px;color:#6c7086;border-top:1px solid #313244;background:#181825}
.online-sec .user{color:#a6e3a1;cursor:pointer;padding:3px 0;font-size:12px}
.online-sec .user:hover{text-decoration:underline}

/* Основная часть */
.main{flex:1;display:flex;flex-direction:column;background:#1e1e2e;min-width:0}
header{padding:12px 16px;background:#181825;border-bottom:1px solid #313244;display:flex;justify-content:space-between;align-items:center;gap:8px}
header .title{font-size:16px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .status{font-size:11px;color:#6c7086;margin-top:2px}
header .actions{display:flex;gap:6px;flex-shrink:0}
header button{background:#313244;color:#cdd6f4;border:none;border-radius:6px;padding:7px 10px;font-size:14px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:12px;max-width:75%;word-wrap:break-word;font-size:14px}
.me{align-self:flex-end;background:#89b4fa;color:#1e1e2e}
.other{align-self:flex-start;background:#313244}
.private-msg{background:#45475a}
.sys{align-self:center;color:#6c7086;font-size:11px;font-style:italic;max-width:90%;text-align:center}
.msg .meta{font-size:10px;opacity:.7;margin-bottom:3px}
footer{display:flex;gap:6px;padding:8px;background:#181825;align-items:center;position:relative}
input{flex:1;min-width:100px;padding:10px;background:#313244;border:none;border-radius:8px;color:#cdd6f4;font-size:14px;outline:none}
footer button{padding:10px 14px;background:#89b4fa;color:#1e1e2e;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer}
footer button.small{padding:8px 10px;background:#313244;color:#cdd6f4;font-size:16px}
#emoji-panel{display:none;position:absolute;bottom:60px;left:8px;right:8px;background:#313244;border-radius:10px;padding:8px;font-size:22px;line-height:1.6;max-height:120px;overflow-y:auto;z-index:10}
#emoji-panel span{cursor:pointer;padding:3px}
.empty{color:#6c7086;text-align:center;padding:40px 20px;font-size:13px}

/* Мобильная адаптация */
@media (max-width:600px){
  .sidebar{width:200px}
  .chat-item .preview{display:none}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    🐧 Pou
    <div class="me">вы: <span id="my-name"></span></div>
  </div>
  <button class="new-chat" onclick="newPrivateChat()">＋ Новый чат</button>
  <div class="chat-list" id="chat-list"></div>
  <div class="online-sec">
    <div style="margin-bottom:5px">ОНЛАЙН</div>
    <div id="online-list">—</div>
  </div>
</aside>

<main class="main">
  <header>
    <div style="min-width:0;flex:1">
      <div class="title" id="chat-title">🌍 Общий чат</div>
      <div class="status" id="status">подключение...</div>
    </div>
    <div class="actions">
      <button onclick="callFriend()" title="Позвонить">📞</button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="emoji-panel"></div>
  <footer>
    <button class="small" onclick="toggleEmoji()">😀</button>
    <input id="input" placeholder="Сообщение..." autocomplete="off">
    <button onclick="send()">➤</button>
  </footer>
</main>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const onlineListEl = document.getElementById('online-list');
const chatListEl = document.getElementById('chat-list');
const chatTitle = document.getElementById('chat-title');
const emojiPanel = document.getElementById('emoji-panel');
document.getElementById('my-name').textContent = '';

let myName = prompt('Ваше имя:', 'Guest') || 'Guest';
document.getElementById('my-name').textContent = myName;

let currentChat = null;   // null = общий, или имя пользователя
let lastTimestamp = 0;
let allMessages = [];     // для построения превью в списке
let unread = {};          // {chatName: count}
let onlineUsers = [];

const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😴','😢','😡','👍','👎','❤️','🔥','🎉','✅','❌','🐧','🚀','💬','📞','👋','🙏','😊','🤗','🤣','😅','🤩','😭','🥺','😱'];

// ---------- Утилиты ----------
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function addMsg(from, text, time, cls, isPrivate) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls + (isPrivate ? ' private-msg' : '');
  d.innerHTML = '<div class="meta">[' + time + '] ' + escapeHtml(from) + '</div>' + escapeHtml(text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addSys(text) {
  const d = document.createElement('div');
  d.className = 'msg sys';
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function clearChat() { chat.innerHTML = ''; }

// ---------- Отправка ----------
async function send() {
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  addMsg('Вы', t, new Date().toLocaleTimeString().slice(0, 8), 'me', !!currentChat);
  try {
    await fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from: myName, text: t, to: currentChat})
    });
  } catch (e) {
    addSys('Не удалось отправить: ' + e.message);
  }
}

// ---------- Опрос сервера ----------
async function poll() {
  try {
    const r = await fetch('/messages?since=' + lastTimestamp + '&user=' + encodeURIComponent(myName));
    const data = await r.json();

    statusEl.textContent = '✅ онлайн';
    statusEl.style.color = '#a6e3a1';

    onlineUsers = data.online;
    renderOnline();

    for (const m of data.messages) {
      lastTimestamp = Math.max(lastTimestamp, m.timestamp);
      allMessages.push(m);

      if (m.from === myName) continue;

      // Определяем, в каком чате показать
      if (m.to === null) {
        // Общее сообщение
        if (currentChat === null) {
          addMsg(m.from, m.text, m.time, 'other', false);
        } else {
          unread['__general__'] = (unread['__general__'] || 0) + 1;
        }
      } else if (m.to === myName) {
        // Личное нам
        if (currentChat === m.from) {
          addMsg(m.from, m.text, m.time, 'other', true);
        } else {
          unread[m.from] = (unread[m.from] || 0) + 1;
        }
      }
    }
    renderChatList();
  } catch (e) {
    statusEl.textContent = '⚠ нет связи';
    statusEl.style.color = '#f38ba8';
  }
}

// ---------- Список чатов ----------
function renderChatList() {
  const items = [];
  // Общий чат
  const generalUnread = unread['__general__'] || 0;
  const lastGeneral = [...allMessages].reverse().find(m => !m.to);
  items.push({
    id: '__general__',
    name: '🌍 Общий чат',
    preview: lastGeneral ? lastGeneral.from + ': ' + lastGeneral.text : 'Пока пусто',
    unread: generalUnread,
    active: currentChat === null
  });

  // Личные чаты — со всеми, кто онлайн или с кем есть переписка
  const chatPartners = new Set();
  onlineUsers.forEach(u => { if (u !== myName) chatPartners.add(u); });
  allMessages.forEach(m => {
    if (m.to && m.from === myName) chatPartners.add(m.to);
    if (m.to === myName) chatPartners.add(m.from);
  });
  // Уже созданные пустые чаты
  (window._manualChats || []).forEach(u => chatPartners.add(u));

  chatPartners.forEach(u => {
    const lastMsg = [...allMessages].reverse().find(m =>
      (m.from === myName && m.to === u) || (m.from === u && m.to === myName)
    );
    items.push({
      id: u,
      name: '💬 ' + u,
      preview: lastMsg ? (lastMsg.from === myName ? 'Вы: ' : '') + lastMsg.text : 'Нет сообщений',
      unread: unread[u] || 0,
      active: currentChat === u
    });
  });

  chatListEl.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (it.active ? ' active' : '');
    div.innerHTML =
      '<div style="flex:1;min-width:0">' +
        '<div class="name">' + escapeHtml(it.name) + '</div>' +
        '<div class="preview">' + escapeHtml(it.preview) + '</div>' +
      '</div>' +
      (it.unread > 0 ? '<div class="badge">' + it.unread + '</div>' : '');
    div.onclick = () => switchChat(it.id === '__general__' ? null : it.id);
    chatListEl.appendChild(div);
  });
}

function renderOnline() {
  const others = onlineUsers.filter(u => u !== myName);
  if (!others.length) {
    onlineListEl.innerHTML = '—';
    return;
  }
  onlineListEl.innerHTML = others.map(u =>
    '<div class="user" onclick="switchChat(\'' + escapeHtml(u) + '\')">' + escapeHtml(u) + '</div>'
  ).join('');
}

// ---------- Переключение чата ----------
function switchChat(name) {
  currentChat = name;
  if (name === null) {
    chatTitle.textContent = '🌍 Общий чат';
    delete unread['__general__'];
  } else {
    chatTitle.textContent = '💬 ' + name;
    delete unread[name];
    if (!window._manualChats) window._manualChats = [];
    if (!window._manualChats.includes(name)) window._manualChats.push(name);
  }
  loadChat();
  renderChatList();
}

function loadChat() {
  clearChat();
  let shown = 0;
  for (const m of allMessages) {
    if (currentChat === null) {
      // Общий — только публичные
      if (m.to) continue;
    } else {
      // Личный — только переписка между мной и собеседником
      const isMineToOther = m.from === myName && m.to === currentChat;
      const isOtherToMe = m.from === currentChat && m.to === myName;
      if (!isMineToOther && !isOtherToMe) continue;
    }
    const cls = m.from === myName ? 'me' : 'other';
    addMsg(m.from, m.text, m.time, cls, !!currentChat);
    shown++;
  }
  if (shown === 0) {
    if (currentChat === null) {
      addSys('Общий чат. Пишите — все увидят.');
    } else {
      addSys('Личный чат с ' + currentChat + '. Никто другой не увидит.');
    }
  }
}

// ---------- Новый чат ----------
function newPrivateChat() {
  const name = prompt('С кем начать чат? Введите имя пользователя:', '');
  if (!name || name === myName) return;
  if (!window._manualChats) window._manualChats = [];
  if (!window._manualChats.includes(name)) window._manualChats.push(name);
  switchChat(name);
}

// ---------- Эмодзи ----------
function toggleEmoji() {
  if (emojiPanel.style.display === 'block') {
    emojiPanel.style.display = 'none';
    return;
  }
  if (!emojiPanel.dataset.filled) {
    emojiPanel.innerHTML = EMOJIS.map(e =>
      '<span onclick="insertEmoji(\'' + e + '\')">' + e + '</span>'
    ).join('');
    emojiPanel.dataset.filled = '1';
  }
  emojiPanel.style.display = 'block';
}
function insertEmoji(e) {
  input.value += e;
  input.focus();
  emojiPanel.style.display = 'none';
}

// ---------- Звонок ----------
function callFriend() {
  let friend;
  if (currentChat) {
    friend = currentChat;
  } else {
    friend = prompt('С кем звонок? Введите имя:', '');
    if (!friend) return;
  }
  fetch('/room?a=' + encodeURIComponent(myName) + '&b=' + encodeURIComponent(friend))
    .then(r => r.json())
    .then(d => {
      const url = 'https://meet.jit.si/' + d.room;
      addSys('📞 Комната звонка: ' + url);
      addSys('Отправьте ссылку собеседнику, чтобы он подключился');
      window.open(url, '_blank');
    })
    .catch(() => addSys('Не удалось создать комнату'));
}

// ---------- Загрузка истории ----------
async function loadHistory() {
  try {
    const r = await fetch('/history');
    const data = await r.json();
    allMessages = data.messages || [];
    if (allMessages.length) {
      lastTimestamp = allMessages[allMessages.length - 1].timestamp;
    }
    renderChatList();
    loadChat();
  } catch (e) {
    addSys('Не удалось загрузить историю');
  }
}

// ---------- Инициализация ----------
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function start() {
  addSys('Добро пожаловать в Pou, ' + myName + '!');
  addSys('Общий чат — для всех. Личные — через "＋ Новый чат".');
  await loadHistory();
  await poll();
  setInterval(poll, 2000);
}

start();
</script>
</body>
</html>
