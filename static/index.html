<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pou</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#1e1e2e;color:#cdd6f4;height:100vh;overflow:hidden;display:flex}

/* Экран входа */
#auth-screen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#1e1e2e}
.auth-box{background:#181825;padding:30px;border-radius:16px;width:340px;max-width:90%}
.auth-box h1{color:#89b4fa;font-size:32px;text-align:center;margin-bottom:6px}
.auth-box p{color:#6c7086;text-align:center;font-size:13px;margin-bottom:20px}
.auth-box input{width:100%;padding:12px;margin-bottom:10px;background:#313244;border:none;border-radius:8px;color:#cdd6f4;font-size:14px;outline:none}
.auth-box button{width:100%;padding:12px;background:#89b4fa;color:#1e1e2e;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;margin-bottom:8px}
.auth-box button.sec{background:#313244;color:#cdd6f4}
.auth-box .error{color:#f38ba8;font-size:12px;text-align:center;min-height:16px;margin-top:8px}
.saved-accounts{margin-top:16px;border-top:1px solid #313244;padding-top:12px}
.saved-accounts .title{font-size:11px;color:#6c7086;margin-bottom:8px}
.saved-accounts .acc{padding:8px;background:#313244;border-radius:6px;margin-bottom:5px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between}
.saved-accounts .acc:hover{background:#45475a}

/* Мессенджер */
#app{display:none;width:100vw;height:100vh}
#app.on{display:flex}
.sidebar{width:250px;background:#181825;display:flex;flex-direction:column;border-right:1px solid #313244}
.brand{padding:14px;font-size:20px;font-weight:bold;color:#89b4fa;border-bottom:1px solid #313244}
.brand .me{font-size:11px;color:#6c7086;font-weight:normal;margin-top:3px}
.admin-badge{background:#f9e2af;color:#1e1e2e;font-size:9px;font-weight:bold;padding:2px 6px;border-radius:4px;margin-left:4px}
.new-chat{margin:8px;padding:8px;background:#89b4fa;color:#1e1e2e;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer}
.chat-list{flex:1;overflow-y:auto}
.chat-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #252535;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-item:hover{background:#313244}
.chat-item.active{background:#313244;border-left:3px solid #89b4fa;padding-left:11px}
.chat-item .name{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .preview{font-size:11px;color:#6c7086;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .badge{background:#f38ba8;color:#1e1e2e;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.online-sec{padding:8px 14px;font-size:11px;color:#6c7086;border-top:1px solid #313244;background:#181825;max-height:150px;overflow-y:auto}
.online-sec .user{color:#a6e3a1;cursor:pointer;padding:3px 0;font-size:12px;display:flex;align-items:center;gap:4px}
.online-sec .user:hover{text-decoration:underline}
.verified-check{color:#1d9bf0;font-weight:bold}
.banned-mark{color:#f38ba8;font-size:11px}
.muted-mark{color:#f9e2af;font-size:11px}

.main{flex:1;display:flex;flex-direction:column;background:#1e1e2e;min-width:0}
header{padding:12px 16px;background:#181825;border-bottom:1px solid #313244;display:flex;justify-content:space-between;align-items:center;gap:8px}
header .title{font-size:16px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .status{font-size:11px;color:#6c7086;margin-top:2px}
header .actions{display:flex;gap:6px;flex-shrink:0}
header button{background:#313244;color:#cdd6f4;border:none;border-radius:6px;padding:7px 10px;font-size:14px;cursor:pointer}
.admin-bar{background:#f9e2af;color:#1e1e2e;padding:8px 12px;font-size:13px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px}
.admin-bar button{background:#1e1e2e;color:#f9e2af;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:bold}

#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:12px;max-width:75%;word-wrap:break-word;font-size:14px}
.me{align-self:flex-end;background:#89b4fa;color:#1e1e2e}
.other{align-self:flex-start;background:#313244}
.private-msg{background:#45475a}
.sys{align-self:center;color:#6c7086;font-size:11px;font-style:italic;max-width:90%;text-align:center}
.sys-admin{align-self:center;color:#1e1e2e;font-size:12px;background:#f9e2af;padding:8px 14px;border-radius:8px;max-width:90%;text-align:left;font-weight:bold;white-space:pre-line}
.msg .meta{font-size:10px;opacity:.7;margin-bottom:3px}
footer{display:flex;gap:6px;padding:8px;background:#181825;align-items:center;position:relative}
input{flex:1;min-width:100px;padding:10px;background:#313244;border:none;border-radius:8px;color:#cdd6f4;font-size:14px;outline:none}
footer button{padding:10px 14px;background:#89b4fa;color:#1e1e2e;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer}
footer button.small{padding:8px 10px;background:#313244;color:#cdd6f4;font-size:16px}
#emoji-panel{display:none;position:absolute;bottom:60px;left:8px;right:8px;background:#313244;border-radius:10px;padding:8px;font-size:22px;line-height:1.6;max-height:120px;overflow-y:auto;z-index:10}
#emoji-panel span{cursor:pointer;padding:3px}
.muted-warn{background:#f9e2af;color:#1e1e2e;padding:8px 12px;font-size:12px;text-align:center;font-weight:bold}
.banned-screen{position:fixed;inset:0;background:#1e1e2e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:9999;text-align:center;padding:30px}
.banned-screen h1{color:#f38ba8;font-size:32px}
.banned-screen p{color:#cdd6f4;font-size:15px}
.admin-menu{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.admin-menu.open{display:flex}
.admin-card{background:#181825;border-radius:12px;padding:20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.admin-card h2{color:#f9e2af;margin-bottom:15px;font-size:20px}
.admin-card h3{color:#89b4fa;font-size:14px;margin:15px 0 8px;border-bottom:1px solid #313244;padding-bottom:5px}
.admin-card .field{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.admin-card input{flex:1;min-width:80px;padding:8px;background:#313244;border:none;border-radius:6px;color:#cdd6f4;font-size:13px}
.admin-card button{background:#89b4fa;color:#1e1e2e;border:none;padding:8px 12px;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer;white-space:nowrap}
.admin-card button.red{background:#f38ba8}
.admin-card button.yellow{background:#f9e2af}
.admin-card button.green{background:#a6e3a1}
.admin-card .close{position:absolute;top:15px;right:15px;background:transparent;color:#cdd6f4;font-size:22px;border:none;cursor:pointer}
.admin-card .list{background:#1e1e2e;border-radius:6px;padding:8px;font-size:12px;max-height:120px;overflow-y:auto;color:#a6adc8;margin-top:5px;white-space:pre-wrap}
@media (max-width:600px){.sidebar{width:200px}.chat-item .preview{display:none}}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>🐧 Pou</h1>
    <p>Мессенджер</p>
    <input id="au-name" placeholder="Имя пользователя" autocomplete="off">
    <input id="au-pass" type="password" placeholder="Пароль">
    <button onclick="doAuth('login')">Войти</button>
    <button class="sec" onclick="doAuth('register')">Регистрация</button>
    <div class="error" id="au-error"></div>
    <div class="saved-accounts" id="saved-acc" style="display:none">
      <div class="title">СОХРАНЁННЫЕ АККАУНТЫ</div>
      <div id="saved-list"></div>
    </div>
  </div>
</div>

<!-- МЕССЕНДЖЕР -->
<div id="app">
  <aside class="sidebar">
    <div class="brand">🐧 Pou<div class="me">вы: <span id="my-name"></span><span id="my-admin" style="display:none" class="admin-badge">ADMIN</span></div></div>
    <button class="new-chat" onclick="newPrivateChat()">＋ Новый чат</button>
    <div class="chat-list" id="chat-list"></div>
    <div class="online-sec"><div style="margin-bottom:5px">ОНЛАЙН</div><div id="online-list">—</div></div>
  </aside>
  <main class="main">
    <div id="admin-bar" class="admin-bar" style="display:none"><span>👑 Режим администратора</span><button onclick="openAdminMenu()">⚙ Панель</button></div>
    <div id="muted-warn" class="muted-warn" style="display:none">🔇 Вы в муте — писать нельзя</div>
    <header>
      <div style="min-width:0;flex:1">
        <div class="title" id="chat-title">🌍 Общий чат</div>
        <div class="status" id="status">подключение...</div>
      </div>
      <div class="actions"><button onclick="callFriend()">📞</button><button onclick="logout()">🚪</button></div>
    </header>
    <div id="chat"></div>
    <div id="emoji-panel"></div>
    <footer>
      <button class="small" onclick="toggleEmoji()">😀</button>
      <input id="input" placeholder="Сообщение..." autocomplete="off">
      <button onclick="send()">➤</button>
    </footer>
  </main>
</div>

<div id="banned-screen" class="banned-screen" style="display:none"><h1>🚫 Вы забанены</h1><p id="ban-reason">Доступ запрещён.</p></div>

<!-- АДМИН-ПАНЕЛЬ -->
<div id="admin-menu" class="admin-menu">
  <div class="admin-card">
    <button class="close" onclick="closeAdminMenu()">✕</button>
    <h2>👑 Админ-панель</h2>
    <h3>🚫 Бан / Разбан</h3>
    <div class="field">
      <input id="ban-user" placeholder="Имя">
      <button class="red" onclick="adminCmd('ban')">Бан</button>
      <button class="green" onclick="adminCmd('unban')">Разбан</button>
    </div>
    <div class="list" id="banned-list">—</div>
    <h3>🔇 Мут</h3>
    <div class="field">
      <input id="mute-user" placeholder="Имя">
      <input id="mute-time" placeholder="Сек" style="max-width:70px">
      <button class="yellow" onclick="adminCmd('mute')">Мут</button>
    </div>
    <div class="field">
      <input id="unmute-user" placeholder="Имя для размута">
      <button class="green" onclick="adminCmd('unmute')">Размут</button>
    </div>
    <div class="list" id="muted-list">—</div>
    <h3>👢 Кик</h3>
    <div class="field"><input id="kick-user" placeholder="Имя"><button class="red" onclick="adminCmd('kick')">Кикнуть</button></div>
    <h3>✅ Верификация</h3>
    <div class="field">
      <input id="verify-user" placeholder="Имя">
      <button onclick="adminCmd('verify')">✅</button>
      <button class="red" onclick="adminCmd('unverify')">❌</button>
    </div>
    <div class="list" id="verified-list">—</div>
    <h3>🗑 Очистка</h3>
    <div class="field"><input id="clear-user" placeholder="Имя (пусто = всё)"><button class="red" onclick="adminCmd('clearchat')">Очистить</button></div>
    <h3>🔍 Инфо о юзере</h3>
    <div class="field"><input id="info-user" placeholder="Имя"><button onclick="adminCmd('info')">Показать</button></div>
    <h3>📋 Онлайн</h3>
    <div class="list" id="online-admin-list">—</div>
  </div>
</div>

<script>
// ===== АВТОРИЗАЦИЯ =====
function getSaved() {
  try { return JSON.parse(localStorage.getItem('pou_saved') || '[]'); } catch { return []; }
}
function saveAcc(name) {
  let s = getSaved();
  if (!s.includes(name)) { s.push(name); localStorage.setItem('pou_saved', JSON.stringify(s)); }
}
function renderSaved() {
  const s = getSaved();
  const box = document.getElementById('saved-acc');
  const list = document.getElementById('saved-list');
  if (!s.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  list.innerHTML = s.map(n =>
    '<div class="acc" onclick="pickAcc(\'' + escapeHtml(n) + '\')">👤 ' + escapeHtml(n) + ' <span style="color:#f38ba8" onclick="event.stopPropagation();delAcc(\'' + escapeHtml(n) + '\')">✕</span></div>'
  ).join('');
}
function pickAcc(name) { document.getElementById('au-name').value = name; document.getElementById('au-pass').focus(); }
function delAcc(name) {
  let s = getSaved().filter(x => x !== name);
  localStorage.setItem('pou_saved', JSON.stringify(s));
  renderSaved();
}

let myName = null;
let amAdmin = false;

async function doAuth(action) {
  const name = document.getElementById('au-name').value.trim();
  const pass = document.getElementById('au-pass').value;
  const err = document.getElementById('au-error');
  err.textContent = '';
  if (!name || !pass) { err.textContent = 'Заполните все поля'; return; }
  try {
    const r = await fetch('/auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, username: name, password: pass})
    });
    const data = await r.json();
    if (!data.ok) { err.textContent = data.error || 'Ошибка'; return; }
    // Успех
    myName = name;
    amAdmin = data.is_admin || name === 'POUADMINISTRATOR';
    saveAcc(name);
    localStorage.setItem('pou_current', name);
    startApp();
  } catch (e) {
    err.textContent = 'Сеть: ' + e.message;
  }
}

async function logout() {
  localStorage.removeItem('pou_current');
  location.reload();
}

// ===== ЭЛЕМЕНТЫ =====
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const onlineListEl = document.getElementById('online-list');
const chatListEl = document.getElementById('chat-list');
const chatTitle = document.getElementById('chat-title');
const emojiPanel = document.getElementById('emoji-panel');

let currentChat = null, lastTimestamp = 0;
let allMessages = [], unread = {}, onlineUsers = [];
let verifiedUsers = new Set(), bannedUsers = new Set(), mutedUsers = {};

const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😴','😢','😡','👍','👎','❤️','🔥','🎉','✅','❌','🐧','🚀','💬','📞','👋','🙏','😊','🤗','🤣','😅','🤩','😭','🥺','😱','👑'];

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function userMarks(name) {
  let m = '';
  if (verifiedUsers.has(name)) m += ' <span class="verified-check">✅</span>';
  if (bannedUsers.has(name)) m += ' <span class="banned-mark">🚫</span>';
  if (mutedUsers[name]) m += ' <span class="muted-mark">🔇</span>';
  return m;
}
function addMsg(from, text, time, cls, isPrivate, isAdminReply) {
  const d = document.createElement('div');
  if (isAdminReply) { d.className = 'msg sys-admin'; d.textContent = text; }
  else {
    d.className = 'msg ' + cls + (isPrivate ? ' private-msg' : '');
    d.innerHTML = '<div class="meta">[' + time + '] ' + escapeHtml(from) + userMarks(from) + '</div>' + escapeHtml(text);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function addSys(text) {
  const d = document.createElement('div');
  d.className = 'msg sys'; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function clearChat() { chat.innerHTML = ''; }

async function send() {
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  addMsg('Вы', t, new Date().toLocaleTimeString().slice(0, 8), 'me', !!currentChat);
  try {
    const r = await fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from: myName, text: t, to: currentChat})
    });
    const data = await r.json();
    if (!data.ok && data.error) addSys('⚠ ' + data.error);
  } catch (e) { addSys('Ошибка: ' + e.message); }
}

async function poll() {
  try {
    const r = await fetch('/messages?since=' + lastTimestamp + '&user=' + encodeURIComponent(myName));
    const data = await r.json();
    if (data.banned) {
      document.getElementById('banned-screen').style.display = 'flex';
      document.getElementById('ban-reason').textContent = data.reason || 'Вы забанены';
      return;
    }
    statusEl.textContent = '✅ онлайн';
    statusEl.style.color = '#a6e3a1';
    onlineUsers = data.online || [];
    verifiedUsers = new Set(data.verified || []);
    bannedUsers = new Set(data.banned || []);
    mutedUsers = data.muted || {};
    document.getElementById('muted-warn').style.display = data.am_muted ? 'block' : 'none';
    renderOnline();
    updateAdminPanel();
    for (const m of data.messages) {
      lastTimestamp = Math.max(lastTimestamp, m.timestamp);
      allMessages.push(m);
      if (m.from === myName) continue;
      if (m.system && m.to === myName) { addMsg('СИСТЕМА', m.text, m.time, 'sys', false, true); continue; }
      if (m.to === null) {
        if (currentChat === null) addMsg(m.from, m.text, m.time, 'other', false);
        else unread['__general__'] = (unread['__general__'] || 0) + 1;
      } else if (m.to === myName) {
        if (currentChat === m.from) addMsg(m.from, m.text, m.time, 'other', true);
        else unread[m.from] = (unread[m.from] || 0) + 1;
      }
    }
    renderChatList();
  } catch (e) {
    statusEl.textContent = '⚠ нет связи';
    statusEl.style.color = '#f38ba8';
  }
}

function renderChatList() {
  const items = [];
  const lastGeneral = [...allMessages].reverse().find(m => !m.to && !m.system);
  items.push({
    id: '__general__', name: '🌍 Общий чат',
    preview: lastGeneral ? lastGeneral.from + ': ' + lastGeneral.text : 'Пока пусто',
    unread: unread['__general__'] || 0, active: currentChat === null
  });
  const partners = new Set();
  onlineUsers.forEach(u => { if (u !== myName) partners.add(u); });
  allMessages.forEach(m => {
    if (m.system) return;
    if (m.to && m.from === myName) partners.add(m.to);
    if (m.to === myName) partners.add(m.from);
  });
  (window._manualChats || []).forEach(u => partners.add(u));
  partners.forEach(u => {
    const last = [...allMessages].reverse().find(m =>
      !m.system && ((m.from === myName && m.to === u) || (m.from === u && m.to === myName)));
    items.push({
      id: u,
      name: '💬 ' + u + (verifiedUsers.has(u) ? ' ✅' : '') + (bannedUsers.has(u) ? ' 🚫' : '') + (mutedUsers[u] ? ' 🔇' : ''),
      preview: last ? (last.from === myName ? 'Вы: ' : '') + last.text : 'Нет сообщений',
      unread: unread[u] || 0, active: currentChat === u
    });
  });
  chatListEl.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (it.active ? ' active' : '');
    div.innerHTML = '<div style="flex:1;min-width:0"><div class="name">' + escapeHtml(it.name) +
      '</div><div class="preview">' + escapeHtml(it.preview) + '</div></div>' +
      (it.unread > 0 ? '<div class="badge">' + it.unread + '</div>' : '');
    div.onclick = () => switchChat(it.id === '__general__' ? null : it.id);
    chatListEl.appendChild(div);
  });
}
function renderOnline() {
  const others = onlineUsers.filter(u => u !== myName);
  if (!others.length) { onlineListEl.innerHTML = '—'; return; }
  onlineListEl.innerHTML = others.map(u => {
    let m = '';
    if (verifiedUsers.has(u)) m += ' ✅';
    if (bannedUsers.has(u)) m += ' 🚫';
    if (mutedUsers[u]) m += ' 🔇';
    return '<div class="user" onclick="switchChat(\'' + escapeHtml(u) + '\')">' + escapeHtml(u) + m + '</div>';
  }).join('');
}
function switchChat(name) {
  currentChat = name;
  if (name === null) { chatTitle.textContent = '🌍 Общий чат'; delete unread['__general__']; }
  else {
    let m = '';
    if (verifiedUsers.has(name)) m += ' ✅';
    chatTitle.textContent = '💬 ' + name + m;
    delete unread[name];
    if (!window._manualChats) window._manualChats = [];
    if (!window._manualChats.includes(name)) window._manualChats.push(name);
  }
  loadChat(); renderChatList();
}
function loadChat() {
  clearChat();
  let shown = 0;
  for (const m of allMessages) {
    if (m.system) continue;
    if (currentChat === null) { if (m.to) continue; }
    else {
      const a = m.from === myName && m.to === currentChat;
      const b = m.from === currentChat && m.to === myName;
      if (!a && !b) continue;
    }
    addMsg(m.from, m.text, m.time, m.from === myName ? 'me' : 'other', !!currentChat);
    shown++;
  }
  if (!shown) addSys(currentChat === null ? 'Общий чат. Пишите — все увидят.' : 'Личный чат с ' + currentChat);
}
function newPrivateChat() {
  const n = prompt('С кем начать чат?', '');
  if (!n || n === myName) return;
  if (!window._manualChats) window._manualChats = [];
  if (!window._manualChats.includes(n)) window._manualChats.push(n);
  switchChat(n);
}
function toggleEmoji() {
  if (emojiPanel.style.display === 'block') { emojiPanel.style.display = 'none'; return; }
  if (!emojiPanel.dataset.filled) {
    emojiPanel.innerHTML = EMOJIS.map(e => '<span onclick="insertEmoji(\'' + e + '\')">' + e + '</span>').join('');
    emojiPanel.dataset.filled = '1';
  }
  emojiPanel.style.display = 'block';
}
function insertEmoji(e) { input.value += e; input.focus(); emojiPanel.style.display = 'none'; }
function callFriend() {
  let f = currentChat;
  if (!f) { f = prompt('С кем звонок?', ''); if (!f) return; }
  fetch('/room?a=' + encodeURIComponent(myName) + '&b=' + encodeURIComponent(f))
    .then(r => r.json()).then(d => {
      const url = 'https://meet.jit.si/' + d.room;
      addSys('📞 ' + url);
      window.open(url, '_blank');
    });
}

// ===== АДМИН-ПАНЕЛЬ =====
function openAdminMenu() { document.getElementById('admin-menu').classList.add('open'); updateAdminPanel(); }
function closeAdminMenu() { document.getElementById('admin-menu').classList.remove('open'); }
function updateAdminPanel() {
  if (!amAdmin) return;
  document.getElementById('banned-list').textContent = bannedUsers.size ? Array.from(bannedUsers).join(', ') : 'пусто';
  document.getElementById('muted-list').textContent = Object.keys(mutedUsers).length
    ? Object.entries(mutedUsers).map(([u, t]) => u + ' (' + t + ')').join('\n') : 'пусто';
  document.getElementById('verified-list').textContent = verifiedUsers.size ? Array.from(verifiedUsers).join(', ') : 'пусто';
  document.getElementById('online-admin-list').textContent = onlineUsers.length ? onlineUsers.join(', ') : 'никого';
}
async function adminCmd(action) {
  let text = '';
  if (action === 'ban') { const u = document.getElementById('ban-user').value.trim(); if (!u) return; text = '/ban ' + u; document.getElementById('ban-user').value = ''; }
  else if (action === 'unban') { const u = document.getElementById('ban-user').value.trim(); if (!u) return; text = '/unban ' + u; document.getElementById('ban-user').value = ''; }
  else if (action === 'mute') { const u = document.getElementById('mute-user').value.trim(); const t = document.getElementById('mute-time').value.trim(); if (!u) return; text = '/mute ' + u + (t ? ' ' + t : ''); document.getElementById('mute-user').value = ''; document.getElementById('mute-time').value = ''; }
  else if (action === 'unmute') { const u = document.getElementById('unmute-user').value.trim(); if (!u) return; text = '/unmute ' + u; document.getElementById('unmute-user').value = ''; }
  else if (action === 'kick') { const u = document.getElementById('kick-user').value.trim(); if (!u) return; text = '/kick ' + u; document.getElementById('kick-user').value = ''; }
  else if (action === 'verify') { const u = document.getElementById('verify-user').value.trim(); if (!u) return; text = '/verify ' + u; document.getElementById('verify-user').value = ''; }
  else if (action === 'unverify') { const u = document.getElementById('verify-user').value.trim(); if (!u) return; text = '/unverify ' + u; document.getElementById('verify-user').value = ''; }
  else if (action === 'clearchat') { const u = document.getElementById('clear-user').value.trim(); text = '/clearchat' + (u ? ' ' + u : ''); document.getElementById('clear-user').value = ''; }
  else if (action === 'info') { const u = document.getElementById('info-user').value.trim(); if (!u) return; text = '/info ' + u; document.getElementById('info-user').value = ''; }
  if (!text) return;
  try {
    const r = await fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from: myName, text: text, to: null})
    });
    const data = await r.json();
    if (data.system_reply) addMsg('СИСТЕМА', data.system_reply, new Date().toLocaleTimeString().slice(0, 8), 'sys', false, true);
  } catch (e) { addSys('Ошибка: ' + e.message); }
  closeAdminMenu();
}

async function loadHistory() {
  try {
    const r = await fetch('/history?user=' + encodeURIComponent(myName));
    const data = await r.json();
    allMessages = data.messages || [];
    verifiedUsers = new Set(data.verified || []);
    amAdmin = data.am_admin || amAdmin;
    if (allMessages.length) lastTimestamp = allMessages[allMessages.length - 1].timestamp;
    renderChatList(); loadChat();
  } catch (e) { addSys('Не удалось загрузить историю'); }
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('au-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth('login'); });

async function startApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('on');
  document.getElementById('my-name').textContent = myName;
  if (amAdmin) {
    document.getElementById('my-admin').style.display = 'inline-block';
    document.getElementById('admin-bar').style.display = 'flex';
  }
  addSys('Добро пожаловать в Pou, ' + myName + '!');
  if (amAdmin) addSys('👑 Вы вошли как администратор.');
  await loadHistory();
  await poll();
  setInterval(poll, 2000);
}

// Автовход если сохранён
window.addEventListener('load', () => {
  renderSaved();
  const cur = localStorage.getItem('pou_current');
  if (cur) {
    // Показываем экран входа — пользователь вводит пароль
    document.getElementById('au-name').value = cur;
    document.getElementById('au-pass').focus();
  }
});
